name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:1.27.3-alpine
    steps:
      - run: apk add --no-cache git
      - uses: actions/checkout@v4
      - run: go vet ./...
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test -count=1 ./...
