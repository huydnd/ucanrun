[package]
name = "ucanrun"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Credential broker for AI agents with human approval"

[[bin]]
name = "ucr"
path = "src/main.rs"

[dependencies]
age = { version = "0.11", default-features = false }
hkdf = "0.12"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
zeroize = "1"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
regex = "1"
url = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tar = "0.4"
flate2 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time", "io-util", "io-std", "fs"] }
axum = "0.8"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-graceful", "service", "http1", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = "8"
mime_guess = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
