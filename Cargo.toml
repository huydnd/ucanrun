[package]
name = "ucanrun"
version = "0.13.4"
edition = "2024"
license = "MIT"
description = "Credential broker for AI agents with human approval"
repository = "https://github.com/huydnd/ucanrun"

# cargo binstall --git https://github.com/huydnd/ucanrun ucanrun
# takes ucr from the release instead of building it.
[package.metadata.binstall]
pkg-fmt = "bin"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/ucr-linux-amd64"
[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/ucr-linux-amd64"
[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/ucr-linux-arm64"
[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/ucr-linux-arm64"
[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/ucr-darwin-amd64"
[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/ucr-darwin-arm64"
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/ucr-windows-amd64.exe"

[[bin]]
name = "ucr"
path = "src/main.rs"

[dependencies]
age = { version = "0.11", default-features = false }
hkdf = "0.12"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
zeroize = "1"
rand = "0.8"
hex = "0.4"
base64 = "0.22"
data-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
regex = "1"
url = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tar = "0.4"
flate2 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time", "io-util", "io-std", "fs"] }
axum = "0.8"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "server-graceful", "service", "http1", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = "8"
mime_guess = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
libc = "0.2"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize", "rand_core"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
ciborium = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Console", "Win32_System_Threading"] }
