services:
  ucanrun:
    image: ucanrun:0.1.0
    build: ..
    container_name: ucanrun
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      - UCANRUN_SECURE_COOKIE=0
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8780:8780"
      - "127.0.0.1:8781:8781"
    networks:
      - web-gateway

networks:
  web-gateway:
    external: true
