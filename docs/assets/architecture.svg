<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720" role="img" aria-labelledby="t d">
  <title id="t">How ucanrun works</title>
  <desc id="d">One request, start to finish. 1: the agent asks to call GET https://api.github.com/user with a Bearer header that names the secret github_token instead of holding it. 2: you see the exact request on your phone and approve it; risky jobs need TOTP or a passkey. 3: ucanrun takes the token from its encrypted vault and sends it only to api.github.com, or hands a signed job to a runner. 4: the agent gets the answer, with any copy of the secret replaced by REDACTED. Below, who holds what: the agent's machine holds only an agent token; the ucanrun server holds the encrypted secrets and the audit log; your phone or browser holds TOTP and passkeys and approves; runners hold their own keys and allow list, and connect out for work.</desc>
  <defs>
    <style>
      .bg{fill:#f6f8fb}
      .panel{fill:#fff;stroke:#d5dde8;stroke-width:1.5}
      .card{fill:#f1f4f8;stroke:#d5dde8}
      .ink{fill:#0f1d33}.mut{fill:#56657c}.acc{fill:#0a6a8a}.okf{fill:#13774a}
      .h1{font:700 20px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      .h2{font:650 16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      .tx{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      .sm{font:12px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      .mono{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .b{font-weight:650}
      .icon{fill:none;stroke:#0a6a8a;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .badge{fill:#0a6a8a}.badget{font:700 13px system-ui,sans-serif;fill:#fff}
      .arrow{stroke:#0a6a8a;stroke-width:2.5;fill:none}.ah{fill:#0a6a8a}
      .phone{fill:#0f2140}.screen{fill:#f6f8fb}
      .bubble{fill:#fff;stroke:#d5dde8}
      .btnok{fill:#13774a}.btnno{fill:#fff;stroke:#bb3426}.btnt{font:600 12px system-ui,sans-serif;fill:#fff}.btnnt{font:600 12px system-ui,sans-serif;fill:#bb3426}
      .red{fill:#bb3426}
      .zone-agent{fill:#fcebe9;stroke:#e8b4ad}.zone-srv{fill:#0f2140}.zone-you{fill:#e2f2f7;stroke:#9ccfdf}.zone-run{fill:#fff;stroke:#d5dde8}
      .w{fill:#fff}.ws{fill:#c9d5e8}
      .link{stroke:#93a4bc;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
      @media (prefers-color-scheme:dark){
        .bg{fill:#0d1117}.panel{fill:#131c2b;stroke:#2b4469}.card{fill:#0d1626;stroke:#2b4469}
        .ink{fill:#dce5f1}.mut{fill:#93a4bc}.acc{fill:#41d3e6}.okf{fill:#5fe0a1}
        .icon{stroke:#41d3e6}.badge{fill:#41d3e6}.badget{fill:#04121f}
        .arrow{stroke:#41d3e6}.ah{fill:#41d3e6}
        .phone{fill:#2b4469}.screen{fill:#0d1626}.bubble{fill:#131c2b;stroke:#2b4469}
        .btnok{fill:#1f9d63}.btnno{fill:#131c2b;stroke:#f47b7b}.btnnt{fill:#f47b7b}.red{fill:#f47b7b}
        .zone-agent{fill:#3a1a22;stroke:#6b2b36}.zone-srv{fill:#13284a}.zone-you{fill:#0f3044;stroke:#1f6b82}.zone-run{fill:#131c2b;stroke:#2b4469}
      }
    </style>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <rect class="bg" width="1080" height="720" rx="16"/>
  <text class="h1 ink" x="24" y="42">One request, start to finish</text>

  <!-- 1. The agent asks -->
  <rect class="panel" x="20" y="62" width="236" height="352" rx="14"/>
  <circle class="badge" cx="44" cy="90" r="13"/><text class="badget" x="44" y="95" text-anchor="middle">1</text>
  <text class="h2 ink" x="66" y="96">The agent asks</text>
  <g class="icon" transform="translate(98 116)"><rect x="6" y="2" width="68" height="44" rx="4"/><path d="M0 54h80M30 46v8M50 46v8"/><path d="M24 20l8 6-8 6M38 32h16"/></g>
  <rect class="card" x="34" y="186" width="208" height="112" rx="8"/>
  <text class="mono ink" x="46" y="208">call GET</text>
  <text class="mono ink" x="46" y="226">https://api.github.com/user</text>
  <text class="mono ink" x="46" y="250">Authorization: Bearer</text>
  <text class="mono acc b" x="46" y="268">{{secret:github_token}}</text>
  <text class="mono mut" x="46" y="288">reason: check my login</text>
  <text class="tx mut" x="34" y="328">It names the secret.</text>
  <text class="tx mut" x="34" y="346">It never has the token: it sees</text>
  <text class="tx mut" x="34" y="364">only names and your notes.</text>

  <!-- 2. You approve -->
  <rect class="panel" x="288" y="62" width="236" height="352" rx="14"/>
  <circle class="badge" cx="312" cy="90" r="13"/><text class="badget" x="312" y="95" text-anchor="middle">2</text>
  <text class="h2 ink" x="334" y="96">You approve</text>
  <rect class="phone" x="336" y="112" width="140" height="210" rx="18"/>
  <rect class="screen" x="344" y="126" width="124" height="182" rx="10"/>
  <rect class="bubble" x="350" y="136" width="112" height="128" rx="8"/>
  <text class="sm ink b" x="358" y="154">claude asks:</text>
  <text class="mono ink" x="358" y="174" font-size="10.5">GET /user</text>
  <text class="mono ink" x="358" y="189" font-size="10.5">api.github.com</text>
  <text class="mono acc" x="358" y="207" font-size="10.5">‹github_token›</text>
  <text class="sm mut" x="358" y="226" font-size="10.5">reason: check</text>
  <text class="sm mut" x="358" y="240" font-size="10.5">my login</text>
  <rect class="btnok" x="350" y="272" width="54" height="24" rx="6"/><text class="btnt" x="377" y="288" text-anchor="middle">Approve</text>
  <rect class="btnno" x="408" y="272" width="54" height="24" rx="6"/><text class="btnnt" x="435" y="288" text-anchor="middle">Deny</text>
  <text class="tx mut" x="302" y="346">You see the real request, not</text>
  <text class="tx mut" x="302" y="364">the agent's summary. Risky jobs</text>
  <text class="tx mut" x="302" y="382">also need TOTP or a passkey.</text>

  <!-- 3. ucanrun runs it -->
  <rect class="panel" x="556" y="62" width="236" height="352" rx="14"/>
  <circle class="badge" cx="580" cy="90" r="13"/><text class="badget" x="580" y="95" text-anchor="middle">3</text>
  <text class="h2 ink" x="602" y="96">ucanrun runs it</text>
  <g class="icon" transform="translate(634 112)"><rect x="0" y="4" width="60" height="22" rx="4"/><rect x="0" y="32" width="60" height="22" rx="4"/><path d="M10 15h.01M10 43h.01"/><rect x="50" y="40" width="26" height="22" rx="3"/><path d="M55 40v-6a8 8 0 0 1 16 0v6"/></g>
  <rect class="card" x="570" y="186" width="208" height="112" rx="8"/>
  <text class="tx ink" x="582" y="208">Takes <tspan class="b">github_token</tspan></text>
  <text class="tx ink" x="582" y="226">from the encrypted vault,</text>
  <text class="tx ink" x="582" y="250">sends it only to a host the</text>
  <text class="tx ink" x="582" y="268">secret allows:</text>
  <text class="mono acc b" x="582" y="288">api.github.com</text>
  <text class="tx mut" x="570" y="328">A command goes to a <tspan class="b">runner</tspan></text>
  <text class="tx mut" x="570" y="346">instead: a signed, encrypted job</text>
  <text class="tx mut" x="570" y="364">for that machine only.</text>
  <text class="tx mut" x="570" y="390">Everything is in the audit log.</text>

  <!-- 4. The agent gets the answer -->
  <rect class="panel" x="824" y="62" width="236" height="352" rx="14"/>
  <circle class="badge" cx="848" cy="90" r="13"/><text class="badget" x="848" y="95" text-anchor="middle">4</text>
  <text class="h2 ink" x="870" y="96">The agent gets</text>
  <text class="h2 ink" x="870" y="116">the answer</text>
  <g class="icon" transform="translate(902 128)"><path d="M10 2h40l14 14v34a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4V6a4 4 0 0 1 4-4z"/><path d="M50 2v14h14M18 30h32M18 40h24"/></g>
  <rect class="card" x="838" y="196" width="208" height="102" rx="8"/>
  <text class="mono okf b" x="850" y="218">200 OK</text>
  <text class="mono ink" x="850" y="240">{"login": "octocat",</text>
  <text class="mono ink" x="850" y="258"> "plan": "free"}</text>
  <text class="mono mut" x="850" y="284">echo → <tspan class="red b">[REDACTED]</tspan></text>
  <text class="tx mut" x="838" y="328">If the token shows up in the</text>
  <text class="tx mut" x="838" y="346">reply or output, it comes back</text>
  <text class="tx mut" x="838" y="364">as [REDACTED].</text>

  <!-- arrows between steps -->
  <path class="arrow" d="M258 238H284" marker-end="url(#ar)"/>
  <path class="arrow" d="M526 238H552" marker-end="url(#ar)"/>
  <path class="arrow" d="M794 238H820" marker-end="url(#ar)"/>

  <!-- Who holds what -->
  <text class="h1 ink" x="24" y="464">Who holds what</text>

  <rect class="zone-agent" x="20" y="482" width="236" height="168" rx="14"/>
  <text class="h2 ink" x="38" y="510">Agent's machine</text>
  <text class="sm red b" x="38" y="530">NOT TRUSTED</text>
  <text class="tx ink" x="38" y="556">AI agent + <tspan class="mono">ucr mcp</tspan></text>
  <text class="tx mut" x="38" y="580">Holds: one agent token</text>
  <text class="tx mut" x="38" y="600">Can: list secrets, ask</text>
  <text class="tx mut" x="38" y="620">Cannot: read a secret</text>

  <rect class="zone-srv" x="288" y="482" width="236" height="168" rx="14"/>
  <text class="h2 w" x="306" y="510">ucanrun server</text>
  <text class="sm ws b" x="306" y="530">YOUR SERVER</text>
  <text class="tx w" x="306" y="556">Web UI · Agent API</text>
  <text class="tx ws" x="306" y="580">Holds: secrets (encrypted),</text>
  <text class="tx ws" x="306" y="598">rules, audit log</text>
  <text class="tx ws" x="306" y="620">Can: run approved work</text>

  <rect class="zone-you" x="556" y="482" width="236" height="168" rx="14"/>
  <text class="h2 ink" x="574" y="510">You</text>
  <text class="sm acc b" x="574" y="530">PHONE OR BROWSER</text>
  <text class="tx ink" x="574" y="556">Telegram, Discord, LINE,</text>
  <text class="tx ink" x="574" y="574">WhatsApp, web</text>
  <text class="tx mut" x="574" y="598">Holds: TOTP, passkeys</text>
  <text class="tx mut" x="574" y="620">Can: approve or deny</text>

  <rect class="zone-run" x="824" y="482" width="236" height="168" rx="14"/>
  <text class="h2 ink" x="842" y="510">Runners (optional)</text>
  <text class="sm mut b" x="842" y="530">PC, SERVER, RASPBERRY PI</text>
  <text class="tx ink" x="842" y="556"><tspan class="mono">ucr runner</tspan>, own user</text>
  <text class="tx mut" x="842" y="580">Holds: its keys, an allow</text>
  <text class="tx mut" x="842" y="598">list of programs</text>
  <text class="tx mut" x="842" y="620">Connects out, opens no port</text>

  <path class="link" d="M256 566H288"/><path class="link" d="M524 566H556"/><path class="link" d="M792 566H824"/>

  <text class="tx mut" x="24" y="688">Agents never hold a secret. Nothing runs until you approve it, unless you allow a secret to run without asking.</text>
</svg>
