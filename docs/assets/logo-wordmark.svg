<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B18"/>
      <stop offset="100%" stop-color="#0B1528"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
  </defs>

  <!-- Nền -->
  <rect width="640" height="180" rx="20" fill="url(#bg)"/>

  <!-- Mark: chữ "u" chứa dấu nhắc lệnh ">" -->
  <g transform="translate(30 30)">
    <rect width="120" height="120" rx="28" fill="#0F2140" stroke="#1E3A8A" stroke-width="2"/>
    <path d="M34 28 V68 A26 26 0 0 0 86 68 V28" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
    <path d="M52 46 L66 58 L52 70" fill="none" stroke="url(#neon)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark: "ucan" sans + "run" monospace (terminal) -->
  <text x="178" y="104" font-size="64" letter-spacing="-1.5"
        font-family="'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" fill="#FFFFFF">ucan<tspan
        font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-weight="700" letter-spacing="0" fill="url(#neon)">run</tspan><tspan
        font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-weight="700" fill="#00FFA3">_<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <!-- Tagline -->
  <text x="181" y="134" font-size="12" letter-spacing="3"
        font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-weight="600" fill="#7C93B4">CREDENTIAL BROKER FOR AI</text>
</svg>
